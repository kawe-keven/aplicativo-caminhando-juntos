      - name: Install Dependencies
        run: pip install google-genai PyGithub

      - name: Run Gemini QA Audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_MODEL: gemini-3.6-flash
        run: |
          python - <<'EOF'
          import os, sys, subprocess, json
          from google import genai
          from github import Github

          def get_git_diff():
              if os.environ.get('GITHUB_EVENT_NAME') == 'pull_request':
                  cmd = ['git', 'diff', f"origin/{os.environ['GITHUB_BASE_REF']}...HEAD"]
              else:
                  cmd = ['git', 'diff', 'HEAD~1', 'HEAD']
              cmd += ['--', '*.dart', '*.java', '*.xml', '*.gradle']
              return subprocess.check_output(cmd).decode('utf-8')

          diff = get_git_diff()[:100000]
          if not diff:
              print("Nenhuma alteração relevante.")
              sys.exit(0)

          client = genai.Client(api_key=os.environ['GEMINI_API_KEY'])
          repo = Github(os.environ['GITHUB_TOKEN']).get_repo(os.environ['GITHUB_REPOSITORY'])

          prompt = f"""Você é Engenheiro de Software Sênior e especialista em QA.
          Analise o git diff do projeto 'Caminhando Juntos' e procure bugs críticos,
          falhas de segurança e problemas de performance.
          Se achar algo crítico, responda APENAS com JSON: {{"title": "...", "body": "..."}}
          Se estiver bom, responda APENAS 'LIMPO'.

          DIFF:
          {diff}"""

          try:
              result = client.models.generate_content(
                  model=os.environ['GEMINI_MODEL'], contents=prompt
              ).text.strip()
              if result.upper() != "LIMPO":
                  data = json.loads(result.replace('`' * 3 + 'json', '').replace('`' * 3, '').strip())
                  repo.create_issue(title=f"[QA-AUTO] {data['title']}",
                                    body=data['body'], labels=['bug', 'qa-auto'])
                  print("Issue criada.")
              else:
                  print("Código aprovado.")
          except Exception as e:
              print(f"ERRO: {e}")
              sys.exit(1)   # agora o job falha de verdade em vez de fingir sucesso
          EOF
